<!-- Botón avatar -->
<div class="relative">
  <button
    #btnDropdownRef
    (click)="toggleDropdown($event)"
    class="flex items-center gap-2 px-3 py-1.5 bg-white rounded-lg hover:bg-gray-50 transition-colors cursor-pointer"
  >
    <!-- Avatar con iniciales -->
    <span
      [class]="size + ' flex items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-blue-600 text-white font-bold text-sm flex-shrink-0'"
    >
      {{ getInitials() }}
    </span>
    <span class="hidden lg:block text-sm font-medium text-gray-700 max-w-[140px] truncate">
      {{ nameEmpresa }}
    </span>
    <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Dropdown panel -->
  <div
    #popoverDropdownRef
    class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 z-50 overflow-hidden"
    [ngClass]="dropdownPopoverShow ? 'block' : 'hidden'"
  >
    <!-- Header con info del usuario -->
    <div class="px-4 py-3 border-b border-gray-100">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 flex items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-blue-600 text-white font-bold text-sm flex-shrink-0">
          {{ getInitials() }}
        </span>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-gray-800 truncate">{{ nameEmpresa }}</p>
          <p class="text-xs text-gray-500 truncate lowercase">{{ email }}</p>
        </div>
      </div>
    </div>

    <!-- Opciones -->
    <div class="py-1">
      <a
        routerLink="/admin/perfil"
        class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer"
        (click)="toggleDropdown($event)"
      >
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Perfil
      </a>
      <a
        routerLink="/admin/gestor_firmas"
        class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors cursor-pointer"
        (click)="toggleDropdown($event)"
      >
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
        </svg>
        Gestionar firmas
      </a>
    </div>

    <div class="border-t border-gray-100">
      <a
        routerLink="/auth/login"
        class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors cursor-pointer"
        (click)="salir($event)"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Cerrar sesión
      </a>
    </div>
  </div>
</div>
