<div class="card-menu p-4 border rounded-xl border-r-gray-200 dark:border-gray-300 shadow-md">
    <a [routerLink]="[linkvamos]" class="block no-underline">
        <div class="flex flex-col items-center">
            <div class="flex w-full items-center">
                <div class="text-white p-5 text-center inline-flex items-center justify-center w-12 h-12 mb-0 shadow-lg rounded-full {{colorIcono}}">
                    <iconify-icon icon="hugeicons:{{tipoIcono}}" width="32" height="32"></iconify-icon>
                </div>
                <h1 class="pl-2 text-xl font-medium break-words">{{titulo}}</h1> <!-- Asegurado el 100% de ancho -->
            </div>
            <div class="flex w-full items-start ">
                <p class="flex-1 text-gray-500 pt-2 pl-2 pr-4 text-justify">
                    {{descripcion}}
                </p>
                <div class="inline-flex text-white text-center items-start justify-center w-24 lg:block">
                    @if (muestradona) {
                      @if (iniciado) {
                        <app-progress-circle [numprogreso]="porcentaje" [colorgreso]="colorgrafica"></app-progress-circle>
                      } @else {
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap">
                          Sin iniciar
                        </span>
                      }
                    }
                </div>
            </div>
        </div>
        
    </a>
</div>
