<!-- h-full: en una rejilla el host se estira, pero sin esto la tarjeta pintada
     se encoge hasta su contenido y las de una misma fila quedan desiguales. -->
<div class="card-menu h-full p-4 border rounded-xl border-gray-200 shadow-sm hover:shadow-md transition-all duration-150"
    [ngClass]="aplica ? '' : 'opacity-60 grayscale bg-gray-50'"
    [attr.title]="aplica ? null : textoNoAplica">
    <a [routerLink]="[linkvamos]" class="flex h-full flex-col no-underline">

        <div class="flex w-full items-center gap-2">
            <div class="shrink-0 text-white inline-flex items-center justify-center w-10 h-10 shadow rounded-full {{colorIcono}}">
                <iconify-icon icon="hugeicons:{{tipoIcono}}" width="24" height="24"></iconify-icon>
            </div>
            <h1 class="text-base font-semibold leading-snug break-words">{{titulo}}</h1>
        </div>

        <!-- flex-1 empuja el estado al fondo: así todas las tarjetas de una
             fila alinean su indicador a la misma altura. -->
        <p class="mt-2 flex-1 text-sm leading-relaxed text-gray-500">
            {{descripcion}}
        </p>

        <div class="mt-3 h-5 flex items-center">
            @if (!aplica) {
              <!-- Un paso no exigible no tiene avance que mostrar -->
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-200 text-gray-600 leading-tight">
                {{ textoNoAplica }}
              </span>
            } @else if (muestradona) {
              @if (iniciado) {
                <div class="flex w-full items-center gap-2">
                  <div class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-200">
                    <div class="h-full rounded-full transition-all duration-500"
                         [style.width.%]="porcentaje"
                         [style.background-color]="colorgrafica"></div>
                  </div>
                  <span class="shrink-0 text-xs font-semibold text-gray-600 tabular-nums">{{porcentaje}}%</span>
                </div>
              } @else {
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-500 whitespace-nowrap">
                  Sin iniciar
                </span>
              }
            }
        </div>

    </a>
</div>
