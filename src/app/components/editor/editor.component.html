<form [formGroup]="agregarDocumentoForm">
  <div class="flex items-center p-2 bg-white border-b border-border mb-2">
    <iconify-icon icon="hugeicons:align-box-top-center" width="24" height="24"></iconify-icon>

    <label for="encabezado" class="flex-1 min-w-0 pl-4 cursor-pointer">
        <p class="font-medium text-gray-800 truncate">Incluir encabezado</p>
        <p class="text-sm text-gray-500">Se agregara el encabezado del documento</p>
    </label>

    <label class="inline-flex items-center me-5 cursor-pointer">
        <input id="encabezado" type="checkbox" class="sr-only peer" formControlName="encabezado" (change)="mostrarEncabezado()"  />
        <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-400"></div>
    </label>
  </div>
  <div class="flex flex-wrap mb-2">
    <div class="w-full lg:w-4/12 px-2">
        <div class="space-y-2">
          <label for="titulodoc" class="block text-sm font-medium text-gray-700">Titulo del documento</label>
          <input type="text" id="titulodoc" formControlName="titulodoc" name="titulodoc" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
    </div>
    <div class="w-full lg:w-4/12 px-2">
        <div class="space-y-2">
          <label for="descripciondoc" class="block text-sm font-medium text-gray-700">Descripción del documento</label>
          <input type="text" id="descripciondoc" formControlName="descripciondoc" name="descripciondoc" 
            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
    </div>
    <div class="w-full lg:w-4/12 px-2">
        <div class="space-y-2">
          <label for="logo" class="block text-sm font-medium text-gray-700 mb-2">Logo</label>
          <app-agregar-imagen (sendUrlParent)="recibeURL = $event"></app-agregar-imagen>
        </div>
    </div>
  </div>
  <div class="flex flex-wrap mb-4">
    <div class="w-full lg:w-4/12 px-2">
      <div class="space-y-2">
        <label for="codigodoc" class="block text-sm font-medium text-gray-700">Código </label>
        <input type="text" id="codigodoc" formControlName="codigodoc" name="codigodoc" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
    </div>
    <div class="w-full lg:w-4/12 px-2">
      <div class="space-y-2">
        <label for="fechadoc" class="block text-sm font-medium text-gray-700">Fecha</label>
        <input type="date" id="fechadoc" formControlName="fechadoc" name="fechadoc" required
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        <!-- <div class="text-red-600 text-xs mt-1" *ngIf="hasError('endDate')">
          {{ getErrorMessage('endDate') }}
        </div> -->
      </div>
    </div>
    <div class="w-full lg:w-4/12 px-2">
      <div class="space-y-2">
        <label for="versiondoc" class="block text-sm font-medium text-gray-700">Versión</label>
        <input type="number" id="versiondoc" formControlName="versiondoc" name="versiondoc" placeholder="0" min="0" max="99" step="0.1"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>
    </div>
  </div>
  <div class="toolbar-container mb-2"></div>
  <div class="border font-normal border-gray-300 rounded-lg shadow-sm overflow-hidden">
    <ckeditor
      formControlName="contenido"
      [editor]="Editor"
      [config]="{
        placeholder: 'Escribe aquí...',
        toolbar: ['bold', 'italic', '|', 'alignment', '|', 'indent', 'outdent', 'bulletedList', 'numberedList', '|', 'undo', 'redo', 'fontSize'],
        fontSize: {
          options: [
            { model: 'tiny', title: 'Tiny', view: { name: 'span', styles: { 'font-size': '8pt' } } },
            { model: 'small', title: 'Small', view: { name: 'span', styles: { 'font-size': '10pt' } } },
            'default',
            { model: 'big', title: 'Big', view: { name: 'span', styles: { 'font-size': '14pt' } } },
            { model: 'huge', title: 'Huge', view: { name: 'span', styles: { 'font-size': '18pt' } } }
          ],
          supportAllValues: false
        }
      }"
      (ready)="onReady($event)"
    ></ckeditor>
  </div>

  <!-- 
  OPCIONES DISPONIBLES PARA TOOLBAR:

  FORMATO DE TEXTO:
  - 'bold' - Negrita
  - 'italic' - Cursiva
  - 'underline' - Subrayado
  - 'strikethrough' - Tachado
  - 'subscript' - Subíndice
  - 'superscript' - Superíndice
  - 'code' - Código en línea

  ALINEACIÓN:
  - 'alignment' - Alineación (izquierda, centro, derecha, justificar)

  LISTAS:
  - 'bulletedList' - Lista con viñetas
  - 'numberedList' - Lista numerada
  - 'indent' - Sangría
  - 'outdent' - Reducir sangría

  ENLACES:
  - 'link' - Insertar/editar enlace
  - 'unlink' - Quitar enlace

  IMÁGENES:
  - 'imageUpload' - Subir imagen
  - 'imageStyle' - Estilo de imagen
  - 'imageTextAlternative' - Texto alternativo

  TABLAS:
  - 'insertTable' - Insertar tabla
  - 'tableColumn' - Columna de tabla
  - 'tableRow' - Fila de tabla
  - 'mergeTableCells' - Combinar celdas

  FORMATO AVANZADO:
  - 'heading' - Encabezados (H1, H2, H3, etc.)
  - 'fontSize' - Tamaño de fuente
  - 'fontFamily' - Familia de fuente
  - 'fontColor' - Color de fuente
  - 'fontBackgroundColor' - Color de fondo
  - 'highlight' - Resaltado
  - 'removeFormat' - Quitar formato

  DOCUMENTO:
  - 'undo' - Deshacer
  - 'redo' - Rehacer
  - 'selectAll' - Seleccionar todo
  - 'findAndReplace' - Buscar y reemplazar

  ESPECIALES:
  - 'specialCharacters' - Caracteres especiales
  - 'horizontalLine' - Línea horizontal
  - 'pageBreak' - Salto de página
  - 'sourceEditing' - Edición de código fuente

  SEPARADORES:
  - '|' - Separador vertical
  - '-' - Separador con espacio

  EJEMPLOS DE CONFIGURACIÓN:

  // Barra básica
  toolbar: ['bold', 'italic', 'underline', '|', 'bulletedList', 'numberedList', '|', 'undo', 'redo']

  // Barra completa
  toolbar: [
    'heading', '|',
    'bold', 'italic', 'underline', 'strikethrough', '|',
    'fontSize', 'fontFamily', 'fontColor', 'fontBackgroundColor', '|',
    'alignment', '|',
    'bulletedList', 'numberedList', '|',
    'indent', 'outdent', '|',
    'link', 'unlink', '|',
    'imageUpload', '|',
    'insertTable', '|',
    'undo', 'redo', '|',
    'sourceEditing'
  ]

  // Barra minimalista
  toolbar: ['bold', 'italic', '|', 'bulletedList', 'numberedList']
  -->
  <div class="flex justify-end">
    <button
      type="button"
      class="mt-4 px-4 py-2 text-gray-600 rounded hover:bg-gray-100 mr-2"
      (click)="limpiar()"
    >
      Limpiar
    </button>
    <button
      type="button"
      class="mt-4 px-4 py-2 bg-amber-400 text-gray-900 rounded hover:bg-amber-300"
      (click)="generarPDF()"
    >
      <span class="flex items-center gap-2">
        <i class="fas fa-download" aria-hidden="true"></i> Descargar PDF
      </span>
    </button>
  </div>
</form>
