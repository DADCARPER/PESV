<div class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-white border-0">
    <div class="rounded-t bg-amber-400  mb-0 px-6 py-6">
        <div class="text-center flex ">
          <button
            [routerLink]="['..']"
            class="bg-red-600 text-white active:bg-red-700 font-bold uppercase text-xs px-1 py-1  rounded shadow hover:shadow-md outline-none focus:outline-none mr-2 ease-linear transition-all duration-150"
            type="button"
          >
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg>
          </button>
          <h6 class="text-blueGray-700 text-xl font-bold line-clamp-1">Líder del PESV - Documentos</h6>
        </div>
    </div>
    <div class=" p-4">
            
      <div class="bg-white rounded-lg border shadow-sm">
        <div class="p-4 border-b">
          <div class="flex items-center justify-between">
              <div class="relative w-80">

                  placeholder="Buscar documento"
                  [(ngModel)]="searchText"
                  (input)="onSearchChange()">
                  <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
              </div>
              <div class="flex gap-2">

                    <div class="flex items-center">

                  <button (click)="modalAddFile.abrirModal()" class="text-amber-500 bg-white border border-solid border-amber-500 hover:bg-amber-500 hover:text-white active:bg-amber-600 font-bold uppercase text-xs px-4 py-2 rounded outline-none focus:outline-none  mb-1 ease-linear transition-all duration-150" type="button">
                      <div class="flex items-center">
                          <iconify-icon icon="hugeicons:upload-square-01" width="18" height="18" class="pr-2 "></iconify-icon> Cargar documento
                      </div>
                  </button>
                  <!-- <p class="text-sm text-gray-500">
                      Por cada 1,000,000 de kilómetros recorridos se presentaron XX cantidad de siniestros viales.
                  </p> -->
                  
              </div>
          </div>
        </div>
          <div class="p-4">
                  <!-- Grid -->
                  <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <ag-grid-angular
                      class="ag-theme-quartz w-full h-[422px]"
                      [rowData]="filteredData"
                      [columnDefs]="columnDefs"
                      [defaultColDef]="defaultColDef"
                      [rowHeight]="40"
                      [headerHeight]="50"
                      [localeText]="{noRowsToShow: 'No hay datos disponibles'}"
                      (gridReady)="onGridReady($event)"
                      (cellClicked)="onCellClicked($event)"
                      [animateRows]="true">
                    </ag-grid-angular>
                  </div>
                  <div class="mt-2 text-sm text-gray-600 text-right">
                      Mostrando {{ filteredData.length }} de {{ datos.length }} registros
                  </div>
