<!-- Fondo oscuro -->
<div *ngIf="mostrarModal()" (click)="cerrarModal()" class="fixed inset-0 z-40 bg-black opacity-25"></div>

<!-- Modal -->
<div *ngIf="mostrarModal()" class="overflow-x-hidden overflow-y-auto fixed inset-0 z-50 outline-none focus:outline-none justify-center items-center flex modal-fade-down">
    <div (click)="$event.stopPropagation()" class="relative mx-auto my-6 bg-white rounded-lg shadow-lg max-w-sm w-full">
    <!-- 'max-w-sm':  'small',
      'max-w-3xl':  'regular',
      'max-w-6xl':  'large' -->
    <!-- Título del modal -->
    <div class="flex items-start justify-between p-5 border-b border-solid border-blueGray-200 rounded-t">
      <h3 class="text-xl font-semibold">
        Importar Colaboradores desde Excel
      </h3>
    </div>
    
    <!-- Contenido del modal -->

    
    <div class="relative p-2 flex-auto">
        
      <!-- <h3 class="text-lg font-semibold mb-4 pb-2 border-b text-gray-700">Establezca costo total de siniestros</h3> -->

      @if(!cargando){
        
        <div class="flex flex-wrap justify-center">
            <!-- Input de archivo oculto -->
            <input type="file" id="file-upload" (change)="uploadFile($event)" class="hidden">

            <!-- Etiqueta que simula el botón con un ícono -->
            <label for="file-upload"
                   class="cursor-pointer flex flex-col items-center justify-center px-24 py-4 bg-amber-50 border border-amber-200 rounded-lg shadow-sm transition hover:bg-amber-100 hover:shadow-md">
                <i class="fas fa-file-upload text-6xl text-amber-400 transition hover:text-amber-600"></i>
                <p class="text-amber-600 text-base mt-2 font-semibold">Clic Aquí</p>
            </label>
        </div>

      }@else{
        <app-loading
                [isLoading]="cargando"
                loadingText="Procesando datos...">
        </app-loading>  
      }

    </div>
   
    <!--footer-->
    <div class="flex items-center justify-end p-5 border-t border-solid border-blueGray-200 rounded-b">
      <button class="text-red-500 background-transparent font-bold uppercase px-6 py-2 text-sm outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150" type="button" (click)="handleCancel()">
        Cancelar
      </button>
    </div>
  </div>
</div>

@if (_alerta.showAlert) {
  <app-alerta-informativo
      [type]="_alerta.alertType"
      [message]="_alerta.alertMessage">
  </app-alerta-informativo>
  }
