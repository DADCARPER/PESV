<div class="bg-white rounded-lg border shadow-sm overflow-hidden">
    <form [formGroup]="paramEncuestaForm">
    <div class="p-4 border-b">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-lg font-medium">Aministrar encuesta</h2>
                <p class="text-sm text-gray-500">
                    Habilita o deshabilita los módulos que deseas incluir en la encuesta.
                </p>
            </div>

            <div class="flex gap-2">
                
                <label class="inline-flex items-center me-5 cursor-pointer "> Activar encuesta 
                    <input id="mostrarEncuesta" type="checkbox" class="sr-only peer" formControlName="mostrarEncuesta" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 ml-2 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
                <a [routerLink]="['/encuesta',nitEmpresa]" target="_blank" class="text-amber-500 bg-white border border-solid border-amber-500 hover:bg-amber-500 hover:text-white active:bg-amber-600 font-bold uppercase text-xs px-4 py-2 rounded outline-none focus:outline-none  mb-1 ease-linear transition-all duration-150" type="button">
                    <div class="flex items-center">
                        <iconify-icon icon="hugeicons:plus-sign-square" width="18" height="18" class="pr-2 "></iconify-icon> Abrir Encuesta
                    </div>
                </a>
                
                <!-- <p class="text-sm text-gray-500">
                    Por cada 1,000,000 de kilómetros recorridos se presentaron XX cantidad de siniestros viales.
                </p> -->
                
            </div>

        </div>
    </div>
    <div class="p-4">
        <div class="space-y-3">
            
            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:ai-user" width="24" height="24"></iconify-icon>

                <div class="flex-1 min-w-0 pl-4">
                    <p class="font-medium text-gray-800 truncate">Módulo 1: Información Personal y Laboral</p>
                    <p class="text-sm text-gray-500">Datos básicos del empleado y su puesto de trabajo</p>
                </div>

                <span class="text-xs font-semibold inline-block py-1 px-2 rounded text-gray-600 bg-gray-200 last:mr-4 mr-4">
                    Default
                </span>
            </div>

            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:heart-check" width="24" height="24"></iconify-icon>

                <label for="modulo2" class="flex-1 min-w-0 pl-4 cursor-pointer">
                    <p class="font-medium text-gray-800 truncate">Módulo 2: Salud y Condición Física</p>
                    <p class="text-sm text-gray-500">Estado de salud y capacidades físicas</p>
                </label>

                <label class="inline-flex items-center me-5 cursor-pointer">
                    <input id="modulo2" type="checkbox" class="sr-only peer" formControlName="modulo2" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
            </div>

            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:car-03" width="24" height="24"></iconify-icon>

                <label for="modulo3" class="flex-1 min-w-0 pl-4 cursor-pointer">
                    <p class="font-medium text-gray-800 truncate">Módulo 3: Conducción y Transporte</p>
                    <p class="text-sm text-gray-500">Experiencia y hábitos de conducción</p>
                </label>

                <label class="inline-flex items-center me-5 cursor-pointer">
                    <input id="modulo3" type="checkbox" class="sr-only peer" formControlName="modulo3" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
            </div>

            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:map-pinpoint-01" width="24" height="24"></iconify-icon>

                <label for="modulo4" class="flex-1 min-w-0 pl-4 cursor-pointer">
                    <p class="font-medium text-gray-800 truncate">Módulo 4: Desplazamientos Laborales</p>
                    <p class="text-sm text-gray-500">Rutas y medios de transporte al trabajo</p>
                </label>

                <label class="inline-flex items-center me-5 cursor-pointer">
                    <input id="modulo4" type="checkbox" class="sr-only peer" formControlName="modulo4" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
            </div>

            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:alert-02" width="24" height="24"></iconify-icon>

                <label for="modulo5" class="flex-1 min-w-0 pl-4 cursor-pointer">
                    <p class="font-medium text-gray-800 truncate">Módulo 5: Identificación de Riesgos</p>
                    <p class="text-sm text-gray-500">Percepción y experiencia con riesgos viales</p>
                </label>

                <label class="inline-flex items-center me-5 cursor-pointer">
                    <input id="modulo5" type="checkbox" class="sr-only peer" formControlName="modulo5" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
            </div>

            <div class="flex items-center p-3 bg-white rounded-md border border-gray-100 hover:border-gray-300 transition-colors">
                <iconify-icon icon="hugeicons:analytics-up" width="24" height="24"></iconify-icon>

                <label for="modulo6" class="flex-1 min-w-0 pl-4 cursor-pointer">
                    <p class="font-medium text-gray-800 truncate">Módulo 6: Mejora y Participación</p>
                    <p class="text-sm text-gray-500">Sugerencias y compromiso con la seguridad</p>
                </label>

                <label class="inline-flex items-center me-5 cursor-pointer" >
                    <input id="modulo6" type="checkbox" class="sr-only peer" formControlName="modulo6" (change)="actualizaParametros()" />
                    <div class="relative w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-0.5 after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-amber-500"></div>
                </label>
            </div>
            
        </div>
    </div>
    </form>
</div>

@if (_alerta.showAlert) {
    <app-alerta-informativo
        [type]="_alerta.alertType"
        [message]="_alerta.alertMessage">
    </app-alerta-informativo>
}
