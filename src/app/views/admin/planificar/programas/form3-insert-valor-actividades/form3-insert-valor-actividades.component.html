<!-- Fondo oscuro -->
<div *ngIf="mostrarModal()" (click)="cerrarModal()" class="fixed inset-0 z-40 bg-black opacity-25"></div>

<!-- Modal -->
<div *ngIf="mostrarModal()" class="overflow-x-hidden overflow-y-auto fixed inset-0 z-50 outline-none focus:outline-none justify-center items-center flex modal-fade-down">
    <div (click)="$event.stopPropagation()" class="relative mx-auto my-6 bg-white rounded-lg shadow-lg max-w-lg w-full">
    <!-- Título del modal -->
    <div class="flex items-start justify-between p-5 border-b border-solid border-blueGray-200 rounded-t">
      <h3 class="text-xl font-semibold">
        {{ datosEdicion.name }}
      </h3>
    </div>
    <form [formGroup]="agregarValorActividadForm" (ngSubmit)="handleSave()">
    <!-- Contenido del modal -->
    <div class="relative p-6 flex-auto">

      <h6 class="text-lg font-semibold mb-2 pb-2 border-b text-gray-700">{{datosEdicion.objetivodescripcion}}</h6>

      <div class="flex flex-wrap mb-4">
        <div class="w-full lg:w-12/12 px-2">
            <div class="space-y-2">
              <div class="text-gray-600 text-xs mt-1">
                {{ datosEdicion.descripcionindicator }}
              </div>
            </div>
        </div>
      </div>

      <div class="flex flex-wrap justify-center mb-4">
        <div class="w-full lg:w-6/12 px-2">
          <div class="space-y-2">
            <label for="valorReal" class="block text-sm font-medium text-gray-700">Valor Actual 
              <span title="ej: Cantidad de capacitaciones realizadas" class="cursor-help inline-flex items-center justify-center w-4 h-4 rounded-full bg-gray-200 text-gray-600 text-xs ml-1">?</span>
            </label>
            <input type="number" id="valorReal" formControlName="valorReal" name="valorReal" placeholder="0" min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            <div class="text-red-600 text-xs mt-1" *ngIf="hasError('valorReal')">
              {{ getErrorMessage('valorReal') }}
            </div>
          </div>
        </div>
      </div>
    
      

    </div>
    <!--footer-->
    <div class="flex items-center justify-end p-5 border-t border-solid border-blueGray-200 rounded-b">
        <button class="text-red-500 background-transparent font-bold uppercase px-6 py-2 text-sm outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150" type="button" (click)="cerrarModal()">
            Cancelar
        </button>
        <button class="bg-emerald-500 text-white active:bg-emerald-600 font-bold uppercase text-sm px-6 py-3 rounded shadow hover:shadow-lg outline-none focus:outline-none mr-1 mb-1 ease-linear transition-all duration-150" type="submit">
            Actualizar
        </button>
    </div>
    </form>
  </div>
</div>

@if (_alerta.showAlert) {
  <app-alerta-informativo
      [type]="_alerta.alertType"
      [message]="_alerta.alertMessage">
  </app-alerta-informativo>
  }
