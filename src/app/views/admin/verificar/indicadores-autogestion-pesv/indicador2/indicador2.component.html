<div class="bg-white rounded-lg border shadow-sm overflow-hidden">
    <div class="p-4 border-b bg-gray-50">
        <div class="flex items-center justify-between">
            <div>
                <h2 class="text-lg font-medium">Costos de Siniestros por nivel de pérdida</h2>
                <p class="text-sm text-gray-500">
                    CSV = Costos directos + Costos indirectos
                </p>
            </div>

            <div class="flex gap-2">
                
                <button (click)="mostrarModalFormulario()" class="text-emerald-500 bg-white border border-solid border-emerald-500 hover:bg-emerald-500 hover:text-white active:bg-emerald-600 font-bold uppercase text-xs px-4 py-2 rounded outline-none focus:outline-none  mb-1 ease-linear transition-all duration-150" type="button">
                    <div class="flex items-center">
                        <iconify-icon icon="hugeicons:plus-sign-square" width="18" height="18" class="pr-2 "></iconify-icon> Costos
                    </div>
                </button>
                <button (click)="mostrarModalFormulario2()" class="text-emerald-500 bg-white border border-solid border-emerald-500 hover:bg-emerald-500 hover:text-white active:bg-emerald-600 font-bold uppercase text-xs px-4 py-2 rounded outline-none focus:outline-none  mb-1 ease-linear transition-all duration-150" type="button">
                    <div class="flex items-center">
                        <iconify-icon icon="hugeicons:plus-sign-square" width="18" height="18" class="pr-2 "></iconify-icon> Meta
                    </div>
                </button>
                <!-- <p class="text-sm text-gray-500">
                    Por cada 1,000,000 de kilómetros recorridos se presentaron XX cantidad de siniestros viales.
                </p> -->
                
            </div>

        </div>
    </div>
    <div class="flex flex-col p-4 gap-4">
        <app-tabla-left
        [headers]="headertabla"
        [leftheaders]="['Costos directos siniestros','Costos indirectos siniestros','META']"
        ></app-tabla-left>
        
        <app-cards-medicion-mensual
        [borderColor]="'border-green-500'"
        [fondoColor]="'bg-emerald-50'"
        [textColor]="'text-emerald-600'"></app-cards-medicion-mensual>

        <app-cards-medicion-trimestral 
        [borderColor]="'border-green-500'"
        [fondoColor]="'bg-emerald-50'"
        [textColor]="'text-emerald-600'"></app-cards-medicion-trimestral>

        <app-cards-medicion-anual
        [textColor]="'text-emerald-600'"
        [valorActual]="'80.52'"
        [colorBarra]="'#16a34d'"
        [valorPorcentual]="80"></app-cards-medicion-anual>
    </div>
</div>
<app-formulario1 #modalFormulario></app-formulario1>
<app-form2-idc2 #modalFormulario2></app-form2-idc2>
