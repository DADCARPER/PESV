<div class="flex">
  <div class="w-full p-4">

        <!-- Contenido -->
        <app-cards-menu class="w-full md:w-1/2"
        [titulo]="'Mejora continua, acciones preventivas y correctivas'"

        [colorIcono]="'bg-sky-400'"

      </div>
      <div class="flex flex-col md:flex-row gap-6">

        [tipoIcono]="'megaphone-01'"
        [colorIcono]="'bg-sky-400'"
